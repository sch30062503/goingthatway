<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Going That Way · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=14">
<style>
.app{max-width:760px}
.a-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0;background:var(--chip);padding:4px;border-radius:10px}
.a-tabs button{border:0;background:none;font-weight:700;font-size:13.5px;color:var(--ink2);padding:8px 12px;border-radius:7px;cursor:pointer}
.a-tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.count{display:inline-block;min-width:20px;background:var(--mark);color:var(--mark-ink);border-radius:99px;font-size:11.5px;padding:0 6px;margin-left:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:13.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.sugg{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
textarea.tmpl{font-size:13px;min-height:84px}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="brand"><h1>Admin</h1><button class="pill" id="outBtn" type="button" hidden>Sign out</button></div>
    <p>Approve posts, match drivers, and text people. Only you can see this page's data.</p>
  </header>
  <main id="view"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=14"></script>
<script src="shared.js?v=14"></script>
<script src="admin.js?v=14"></script>
</body>
</html>
